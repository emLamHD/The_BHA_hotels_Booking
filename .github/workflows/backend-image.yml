name: Backend image

# CUST-WEB-SHOWCASE-001-CP02 (+C1), BHA-BACKEND-CD-001-CP01. The API image is verified, built ONCE per run and,
# only when explicitly enabled, published to Amazon ECR. Nothing here deploys: a skipped publish job means
# "nothing was published", a successful one means "an immutable image exists", never "rolled out".
#
#   pull_request (develop|main) -> verify + build the PR head. No credentials, no AWS, no publish.
#   push develop  -> verify + build; publishes (lane `develop`, NOT a production release) only when the repository
#                    variable ECR_PUBLISH_ENABLED is exactly "true".
#   push main     -> verify + build; publishes (lane `main`, the release image) only when the repository variable
#                    BACKEND_RELEASE_PUBLISH_ENABLED is exactly "true" (unset/empty/false = disabled; it must be a
#                    REPOSITORY variable: the plan job runs outside any environment). ECR_PUBLISH_ENABLED never
#                    controls main.
#                    Main's AWS settings are BACKEND_RELEASE_AWS_ROLE_ARN / _AWS_REGION / _ECR_REPOSITORY, defined ONLY in the
#                    backend-production environment; a value for any of them at organization/repository scope is refused
#                    before any AWS authentication, and main never falls back to the develop names.
#   other events/refs never publish. There is no workflow_dispatch: retry a failed publish with "Re-run failed
#   jobs" on the same run (same github.sha), never with an arbitrary ref/SHA/digest.
#
# Source: a push builds github.sha, checked out by exact full SHA with HEAD asserted. The image is built once,
# checked (non-root, Production key-path guard, OCI labels), saved/loaded to prove identity, and that same image is
# what the publish job loads and pushes. Tag = full source SHA (the repository must be IMMUTABLE).
#
# Concurrency: pushes never cancel a running workflow (only PR runs are superseded) and the main publish job has
# cancel-in-progress: false. This is not a queue: a run waiting behind another may be replaced by a newer one, so
# not every intermediate main SHA is built or published and the order is not guaranteed FIFO.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - Back_End/**
      - deploy/showcase/**
      - .github/workflows/backend-image.yml
      - .github/workflows/ci.yml
  push:
    branches: [develop, main]
    paths:
      - Back_End/**
      - deploy/showcase/**
      - .github/workflows/backend-image.yml
      - .github/workflows/ci.yml

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POLICY: deploy/showcase/scripts/backend-release-policy.sh

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      lane: ${{ steps.plan.outputs.lane }}
      publish: ${{ steps.plan.outputs.publish }}
      deploy: ${{ steps.plan.outputs.deploy }}
      inherited_deploy_role_arn_set: ${{ steps.plan.outputs.inherited_deploy_role_arn_set }}
      inherited_instance_id_set: ${{ steps.plan.outputs.inherited_instance_id_set }}
      inherited_host_config_set: ${{ steps.plan.outputs.inherited_host_config_set }}
      inherited_role_arn_set: ${{ steps.plan.outputs.inherited_role_arn_set }}
      inherited_region_set: ${{ steps.plan.outputs.inherited_region_set }}
      inherited_repository_set: ${{ steps.plan.outputs.inherited_repository_set }}
    steps:
      - name: Checkout the policy script at the source commit
        uses: actions/checkout@v4
        with:
          # A pull_request run has a synthetic merge commit in github.sha; provenance is the PR head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: deploy/showcase/scripts
          persist-credentials: false

      - name: Decide source SHA and whether to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MAIN_PUBLISH_ENABLED: ${{ vars.BACKEND_RELEASE_PUBLISH_ENABLED }}
          MAIN_DEPLOY_ENABLED: ${{ vars.BACKEND_RELEASE_DEPLOY_ENABLED }}
          DEVELOP_PUBLISH_ENABLED: ${{ vars.ECR_PUBLISH_ENABLED }}
          # This job has no environment: whatever these resolve to is inherited from repository/organization scope.
          INHERITED_ROLE_ARN: ${{ vars.BACKEND_RELEASE_AWS_ROLE_ARN }}
          INHERITED_REGION: ${{ vars.BACKEND_RELEASE_AWS_REGION }}
          INHERITED_REPOSITORY: ${{ vars.BACKEND_RELEASE_ECR_REPOSITORY }}
          INHERITED_DEPLOY_ROLE_ARN: ${{ vars.BACKEND_RELEASE_DEPLOY_AWS_ROLE_ARN }}
          INHERITED_INSTANCE_ID: ${{ vars.BACKEND_RELEASE_EC2_INSTANCE_ID }}
          INHERITED_HOST_CONFIG: ${{ vars.BACKEND_RELEASE_HOST_CONFIG_PATH }}
        run: bash "$POLICY" plan

  verify:
    name: Backend suite on the source commit
    # Gate for publishing and, on every event, evidence for the exact commit that is built: the same backend
    # build/tests as ci.yml, on real PostgreSQL 18.3 (the version RDS runs).
    needs: plan
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      ConnectionStrings__TheBhaDatabase: Host=localhost;Port=5432;Database=thebha_ci;Username=thebha_ci;Password=ci-only-password
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: thebha_ci
          POSTGRES_USER: thebha_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thebha_ci -d thebha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: HEAD is the source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: PostgreSQL server version is 18.3
        run: |
          version="$(docker exec "${{ job.services.postgres.id }}" psql -U thebha_ci -d thebha_ci -Atc 'show server_version')"
          echo "server_version=$version"
          echo "PostgreSQL server_version: $version" >> "$GITHUB_STEP_SUMMARY"
          case "$version" in 18.3|"18.3 "*) ;; *) echo "::error::Expected PostgreSQL 18.3."; exit 1 ;; esac

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Back_End/TheBha.Booking.sln

      - name: Build
        run: dotnet build Back_End/TheBha.Booking.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Back_End/TheBha.Booking.sln --configuration Release --no-build

  build:
    name: Build image
    needs: plan
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      IMAGE: thebha-api:${{ needs.plan.outputs.source_sha }}
      EXPECT_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      EXPECT_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    outputs:
      image_id: ${{ steps.pack.outputs.image_id }}
      tar_sha256: ${{ steps.pack.outputs.tar_sha256 }}
      artifact_name: ${{ steps.name.outputs.artifact_name }}
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: HEAD is the source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Build the image (once, no push)
        run: |
          docker build --tag "$IMAGE" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=$EXPECT_SOURCE_URL" Back_End

      - name: Image runs as a non-root user with the key directory writable
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test "$(id -u)" != 0 && test -w /var/keys && echo "uid=$(id -u) keys writable"'

      - name: Production refuses to start without a key directory
        run: |
          set +e
          out="$(docker run --rm -e ASPNETCORE_ENVIRONMENT=Production \
            -e 'ConnectionStrings__TheBhaDatabase=Host=none;Database=none;Username=none;Password=none' \
            "$IMAGE" 2>&1)"
          code=$?
          set -e
          echo "$out" | grep -q 'DataProtection:KeysPath must point to durable shared storage' && [ "$code" -ne 0 ]

      - name: Image identity and OCI labels
        run: bash "$POLICY" check-image "$IMAGE"

      - name: Save, remove and reload the image (identity must survive)
        id: pack
        run: |
          bash "$POLICY" pack "$IMAGE" "$RUNNER_TEMP/image"
          docker rmi "$IMAGE" > /dev/null
          EXPECT_TAR_SHA256="$(jq -r .tar_sha256 "$RUNNER_TEMP/image/metadata.json")" \
          EXPECT_IMAGE_ID="$(jq -r .image_id "$RUNNER_TEMP/image/metadata.json")" \
            bash "$POLICY" unpack "$RUNNER_TEMP/image" "$IMAGE"

      - name: Name the artifact after the commit, run and attempt
        id: name
        run: echo "artifact_name=backend-image-$SOURCE_SHA-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload the image for the publish job of this run
        if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ runner.temp }}/image
          retention-days: 3
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Image built (not published, not deployed)"
            echo "- tested source SHA: \`$SOURCE_SHA\` (event: ${{ github.event_name }}; a pull_request builds the PR head, not a merge result)"
            echo "- Docker image ID: \`${{ steps.pack.outputs.image_id }}\`"
            echo "- run: \`${{ github.run_id }}\` attempt \`${{ github.run_attempt }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-main:
    name: Publish release image to ECR (main)
    needs: [plan, verify, build]
    if: needs.plan.outputs.lane == 'main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: backend-production
    concurrency:
      group: backend-release-publish-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
      ecr_repository: ${{ steps.publish.outputs.ecr_repository }}
      image_uri: ${{ steps.publish.outputs.image_uri }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      IMAGE: thebha-api:${{ needs.plan.outputs.source_sha }}
      EXPECT_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      EXPECT_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      EXPECT_IMAGE_ID: ${{ needs.build.outputs.image_id }}
      EXPECT_TAR_SHA256: ${{ needs.build.outputs.tar_sha256 }}
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: HEAD is the source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Release configuration (before any AWS authentication)
        id: config
        env:
          ROLE_ARN: ${{ vars.BACKEND_RELEASE_AWS_ROLE_ARN }}
          REGION: ${{ vars.BACKEND_RELEASE_AWS_REGION }}
          REPOSITORY: ${{ vars.BACKEND_RELEASE_ECR_REPOSITORY }}
          INHERITED_ROLE_ARN_SET: ${{ needs.plan.outputs.inherited_role_arn_set }}
          INHERITED_REGION_SET: ${{ needs.plan.outputs.inherited_region_set }}
          INHERITED_REPOSITORY_SET: ${{ needs.plan.outputs.inherited_repository_set }}
        run: bash "$POLICY" require-config main

      - name: Download the image built by this run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/image

      - name: Load the image and verify tar, image ID and labels
        run: bash "$POLICY" unpack "$RUNNER_TEMP/image" "$IMAGE"

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ steps.config.outputs.region }}
          # The registry host contains the account ID; a masked value would be dropped from the job outputs.
          mask-aws-account-id: false

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the checked image (immutable tag = source commit SHA)
        id: publish
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ steps.config.outputs.repository }}
          IMAGE_ID: ${{ needs.build.outputs.image_id }}
          SUMMARY_TITLE: Release image published
        run: bash deploy/showcase/scripts/backend-ecr-publish.sh

  deploy-main:
    name: Deploy the published release image to EC2 through SSM (main)
    # Only the digest this run just published, only from the tip of main, only with BACKEND_RELEASE_DEPLOY_ENABLED=true.
    # There is no workflow_dispatch and no input: nothing but this run's own outputs can reach the host.
    needs: [plan, publish-main]
    if: needs.plan.outputs.lane == 'main' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: backend-production
    # 40 min: the client polls at most 1740 s (delivery 120 + execution 1500 + margin 120) plus packet/credentials/report margin.
    timeout-minutes: 40
    concurrency:
      group: backend-release-deploy-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PUBLISHED_SHA: ${{ needs.publish-main.outputs.source_sha }}
      IMAGE_URI: ${{ needs.publish-main.outputs.image_uri }}
      IMAGE_DIGEST: ${{ needs.publish-main.outputs.image_digest }}
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: HEAD is the source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Deployment configuration (before any AWS authentication)
        id: deployconfig
        env:
          DEPLOY_ROLE_ARN: ${{ vars.BACKEND_RELEASE_DEPLOY_AWS_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.BACKEND_RELEASE_EC2_INSTANCE_ID }}
          HOST_CONFIG_PATH: ${{ vars.BACKEND_RELEASE_HOST_CONFIG_PATH }}
          REGION: ${{ vars.BACKEND_RELEASE_AWS_REGION }}
          PUBLISH_ROLE_ARN: ${{ vars.BACKEND_RELEASE_AWS_ROLE_ARN }}
          INHERITED_DEPLOY_ROLE_ARN_SET: ${{ needs.plan.outputs.inherited_deploy_role_arn_set }}
          INHERITED_INSTANCE_ID_SET: ${{ needs.plan.outputs.inherited_instance_id_set }}
          INHERITED_HOST_CONFIG_SET: ${{ needs.plan.outputs.inherited_host_config_set }}
        run: bash "$POLICY" require-deploy-config

      - name: This commit is still the tip of main
        env:
          MAIN_REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: bash "$POLICY" check-main-head

      - name: Build the release packet from the commit's git objects
        run: |
          python3 deploy/showcase/scripts/backend-release-packet.py generate --repo . --source-sha "$SOURCE_SHA" \
            --github-repository "$GITHUB_REPOSITORY" --image-uri "$IMAGE_URI" --image-digest "$IMAGE_DIGEST" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/packet"

      - name: Configure AWS credentials for the deploy role (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.deployconfig.outputs.deploy_role_arn }}
          aws-region: ${{ steps.deployconfig.outputs.deploy_region }}
          mask-aws-account-id: false

      - name: Deploy through SSM and confirm the remote result
        env:
          INSTANCE_ID: ${{ steps.deployconfig.outputs.instance_id }}
          HOST_CONFIG_PATH: ${{ steps.deployconfig.outputs.host_config_path }}
          REGION: ${{ steps.deployconfig.outputs.deploy_region }}
        run: |
          python3 deploy/showcase/scripts/backend-ssm-release.py deploy --packet "$RUNNER_TEMP/packet/packet.json" \
            --instance-id "$INSTANCE_ID" --region "$REGION" --host-config "$HOST_CONFIG_PATH" --out "$RUNNER_TEMP/release-result"

  publish-develop:
    name: Publish develop image to ECR (not a release)
    needs: [plan, verify, build]
    if: needs.plan.outputs.lane == 'develop' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: showcase-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
      ecr_repository: ${{ steps.publish.outputs.ecr_repository }}
      image_uri: ${{ steps.publish.outputs.image_uri }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      IMAGE: thebha-api:${{ needs.plan.outputs.source_sha }}
      EXPECT_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      EXPECT_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      EXPECT_IMAGE_ID: ${{ needs.build.outputs.image_id }}
      EXPECT_TAR_SHA256: ${{ needs.build.outputs.tar_sha256 }}
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: HEAD is the source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Publish configuration (before any AWS authentication)
        env:
          ROLE_ARN: ${{ vars.AWS_ECR_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: bash "$POLICY" require-config develop

      - name: Download the image built by this run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/image

      - name: Load the image and verify tar, image ID and labels
        run: bash "$POLICY" unpack "$RUNNER_TEMP/image" "$IMAGE"

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: false

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the checked image (immutable tag = source commit SHA)
        id: publish
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_ID: ${{ needs.build.outputs.image_id }}
          SUMMARY_TITLE: Develop image published (not a production release)
        run: bash deploy/showcase/scripts/backend-ecr-publish.sh
