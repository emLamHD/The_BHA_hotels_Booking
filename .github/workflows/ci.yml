name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front_End/Customer_Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: Front_End/Customer_Web/.nvmrc
          cache: npm
          cache-dependency-path: Front_End/Customer_Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  admin:
    name: Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front_End/Admin_Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: Front_End/Admin_Web/.nvmrc
          cache: npm
          cache-dependency-path: Front_End/Admin_Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # BHA-CI-FAST-001: the integration tests run strictly one after another against one database (PostgreSqlCollection),
  # about 25 minutes on one runner. They are split by test class over four jobs, each with its own PostgreSQL service
  # and its own database, so the tests inside a job are unchanged. Back_End/tests/ci/integration-shards.json says which
  # classes go where; the last shard takes every class that is not named.
  backend-tests:
    name: Backend tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ConnectionStrings__TheBhaDatabase: Host=localhost;Port=5432;Database=thebha_ci;Username=thebha_ci;Password=ci-only-password
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: thebha_ci
          POSTGRES_USER: thebha_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thebha_ci -d thebha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PostgreSQL server version is 18.3
        run: |
          version="$(docker exec "${{ job.services.postgres.id }}" psql -U thebha_ci -d thebha_ci -Atc 'show server_version')"
          echo "server_version=$version"
          echo "PostgreSQL server_version: $version" >> "$GITHUB_STEP_SUMMARY"
          case "$version" in 18.3|"18.3 "*) ;; *) echo "::error::Expected PostgreSQL 18.3."; exit 1 ;; esac

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Back_End/TheBha.Booking.sln

      - name: Build
        run: dotnet build Back_End/TheBha.Booking.sln --configuration Release --no-restore

      # The gate (job "Backend") compares what the shards ran with these unfiltered lists.
      - name: List the tests of this build
        run: |
          mkdir -p test-results
          dotnet test Back_End/tests/TheBha.IntegrationTests/TheBha.IntegrationTests.csproj --configuration Release --no-build --list-tests > "test-results/list-integration-${{ matrix.shard }}.txt"
          if [ "${{ matrix.shard }}" = "1" ]; then
            dotnet test Back_End/tests/TheBha.UnitTests/TheBha.UnitTests.csproj --configuration Release --no-build --list-tests > test-results/list-unit.txt
          fi

      - name: Unit tests
        if: matrix.shard == 1
        run: dotnet test Back_End/tests/TheBha.UnitTests/TheBha.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory test-results

      - name: Integration tests (shard ${{ matrix.shard }}/4)
        run: |
          filter="$(python3 Back_End/tests/ci/ci_shards.py filter ${{ matrix.shard }})"
          dotnet test Back_End/tests/TheBha.IntegrationTests/TheBha.IntegrationTests.csproj --configuration Release --no-build --filter "$filter" --logger "trx;LogFileName=integration-${{ matrix.shard }}.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # The required check is named "Backend". It must run even when a shard fails or is cancelled (a skipped required
  # check counts as passing on GitHub), and it passes only if every shard succeeded AND every listed test ran once.
  backend:
    name: Backend
    needs: backend-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: backend-test-results-*
          path: test-results
          merge-multiple: true

      - name: Gate logic self-test
        run: python3 Back_End/tests/ci/ci_shards.py selftest

      - name: Verify every shard passed and every test ran
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 Back_End/tests/ci/ci_shards.py verify --artifacts test-results --shards 4 --needs-json "$NEEDS"
