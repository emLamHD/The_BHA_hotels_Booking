# CUST-WEB-SHOWCASE-001-CP02: TLS terminator in front of the API container.
# It overwrites (never appends to) X-Forwarded-For and sets X-Forwarded-Proto itself, so nothing
# a client sends in those headers reaches the API; the API trusts only this proxy's address.
worker_processes 1;
events { worker_connections 256; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
    }
  }
}
